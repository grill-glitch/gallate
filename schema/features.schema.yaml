# Features schema — returned by `cli features --yaml`.
# See docs/protocol/03-discovery.md § Features.

$schema: https://json-schema.org/draft-07/schema#
$id: https://github.com/grill-glitch/gallate/schema/features.schema.yaml
title: Features
description: Static capability description of a CLI.

required:
  - type
  - operations
  - media
  - validation
  - runtime

properties:
  type:
    type: string
    const: features

  operations:
    type: object
    description: Operation support flags.
    additionalProperties:
      type: boolean
    properties:
      extract:
        type: boolean
      inject:
        type: boolean
      build:
        type: boolean
      unpack:
        type: boolean
      repack:
        type: boolean

  # NOTE: This top-level key was called `resources` in earlier drafts.
  # Renamed to `media` to eliminate ambiguity with the per-resource
  # notion used elsewhere (resource path, resource id, per-resource
  # tree). Field semantics are unchanged.
  media:
    type: object
    description: |
      Media support flags. Two media are part of the standard
      baseline that every gallate CLI MUST be able to declare:
      `text` and `image`. `audio` and `video` are engine-extension
      media — a Wrapper MAY assume `text` and `image` are baseline
      and MUST NOT assume `audio` / `video` are present. Additional
      keys are allowed for engine-specific media (e.g. `font`,
      `bgm`, `cutscene`); see docs/shell-layer/04-media.md.
    additionalProperties:
      type: boolean
    properties:
      text:
        type: boolean
        description: |
          Standard media. Every gallate CLI SHOULD be able to
          support text; a no-text CLI is invalid.
      image:
        type: boolean
        description: |
          Standard media. Engines MAY decline to support it
          (e.g. ASCII adventure).
      audio:
        type: boolean
        description: |
          Engine-extension media. Only present when the engine
          supports audio.
      video:
        type: boolean
        description: |
          Engine-extension media. Only present when the engine
          supports video.

  validation:
    type: object
    description: Validation capability flags.
    additionalProperties:
      type: boolean
    properties:
      syntax:
        type: boolean
      regex:
        type: boolean
      placeholder:
        type: boolean
      constraint:
        type: boolean

  runtime:
    type: object
    description: Runtime capability flags.
    additionalProperties:
      type: boolean
    properties:
      events:
        type: boolean
      status:
        type: boolean
      statistics:
        type: boolean
      cancellation:
        type: boolean

additionalProperties: true