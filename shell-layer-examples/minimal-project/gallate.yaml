# Minimal gallate project
#
# Generated by:
#   tool init ./my-game \
#     --input ./game.pfs \
#     --output ./game-zh.pfs \
#     --media text,image
#
# This is the bare-bones layout — what `init` produces with only
# input/output/media flags and nothing else.

input: ./game.pfs

media:
  - text
  - image

output: ./game-zh.pfs

# Per-media defaults that `init` writes when the CLI supports them.
# Both blocks use standard values; users edit them freely.
text:
  format: xliff
  layout: flat
  metadata:
    original_file: true
    source_context: true
    location: true
    engine_path: true

image:
  layout: sub_media_dirs