# Minimal gallate project
#
# Generated by:
#   tool init ./my-game \
#     --input ./game.pfs \
#     --output ./game-zh.pfs \
#     --media text,image
#
# This is the bare-bones layout — what `init` produces with only
# input/output/media flags and nothing else.

input: ./game.pfs

media:
  - text
  - image

output: ./game-zh.pfs

# Per-media defaults that `init` writes when the CLI supports them.
# Both blocks use standard values; users edit them freely.
text:
  format: json
  layout: flat
  metadata:
    original_file: true
    source_context: true
    location: true
    placeholders: true
    engine_path: true
  hardcoded:
    context_lines: 3
    max_bytes: 4096
    engine_extensions:
      - .py
      - .lua
      - .rpy
      - .ks
  lifecycle:
    written_on: extract
    read_on:
      - post-extract
      - pre-inject
  meta:
    original_file:  original_file
    source_context: source_context
    location:       location
    placeholders:   placeholders
    engine_path:    engine_path

image:
  layout: sub_media_dirs