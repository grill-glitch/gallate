# Full gallate project
#
# A complete reference configuration that demonstrates every
# standard top-level key plus engine-extension options.
#
# Use this as the starting template for production projects.
# The exact engine options depend on your CLI; see
# `engine-options.md` in this directory.

# ── Input ───────────────────────────────────────────────────────
input: ./game.pfs

# ── Output ──────────────────────────────────────────────────────
output: ./game-zh.pfs

# ── Default media ────────────────────────────────────────────────
# Standard baseline. `audio` and `video` would appear here too if
# your CLI exposes them and you want them in the default media set.
media:
  - text
  - image

# ── Default ignore ──────────────────────────────────────────────
ignore:
  - "*.tmp"
  - "cache/"
  - "debug.log"

# ── Pre / Post scripts ──────────────────────────────────────────
scripts:
  pre:
    - ./scripts/unpack.py
  post:
    - ./scripts/repack.py

# ── Per-media output configuration ──────────────────────────────
# Text media: JSON, flat layout, with original_file and context
# (source-context) for hardcoded strings.
text:
  format: json
  layout: flat
  metadata:
    original_file: true
    source_context: true
    location: true
    placeholders: true
    engine_path: true
  hardcoded:
    context_lines: 3
    max_bytes: 4096
    engine_extensions:
      - .py
      - .lua
      - .rpy
      - .ks
  # When each metadata field is written and read.
  lifecycle:
    written_on: extract          # extract | never
    read_on:                     # post-extract / pre-inject / build
      - post-extract
      - pre-inject
  # Pure mappings: which output key each metadata field lands in.
  meta:
    original_file:  original_file
    source_context: source_context
    location:       location
    placeholders:   placeholders
    engine_path:    engine_path

image:
  layout: sub_media_dirs

# ── Engine options ──────────────────────────────────────────────
# These keys are engine-specific. The standard CLI passes them
# through verbatim. The engine wrapper interprets them.
engine:

  # Plain engine option (top-level key under engine:)
  text_encoding: utf-8
  rebuild_index: true

  # Sub-Media configuration under standard text media
  text:
    includes:
      - dialog
      - menu
      - hardcoded
    excludes:
      - debug_log

  # Sub-Media configuration under standard image media
  image:
    includes:
      - background
      - portrait
      - portrait_diff
      - ui
    excludes:
      - ui           # project has stabilized, no UI changes expected

  # Sub-Media configuration under extension media (audio)
  # Valid only when this CLI exposes `audio`.
  audio:
    includes:
      - voice
      - bgm
    excludes:
      - sfx          # skip sound effects in this project

  # Sub-Media configuration under extension media (video)
  video:
    includes:
      - cutscene
      - opening

  # Extension media (font) with sub-media of its own
  font:
    includes:
      - ascii
      - cjk