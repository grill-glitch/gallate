# full-cli validation rules
# Returned by: full-cli validation --yaml

type: validation-rules

rules:

  - id: control-code
    type: regex
    scope: text
    pattern: "\\[A-Z]+(?:_[0-9]+)?"
    flags: []
    severity: error
    description: |
      Detects engine control codes like `[FADE_IN_3]` that must be
      preserved in the translation target.

  - id: player-name
    type: placeholder
    scope: text
    pattern: "\\{player\\}"
    preserve: true
    severity: error
    description: |
      The `{player}` placeholder must appear verbatim in target.

  - id: narrator-name
    type: placeholder
    scope: target
    pattern: "\\{narrator\\}"
    preserve: true
    severity: error

  - id: max-line-length
    type: constraint
    scope: text
    constraint:
      maxLength: 80
      noLineBreak: false
    severity: warning
    description: |
      Warns when a single line exceeds the engine's textbox width.

  - id: suspect-double-space
    type: regex
    scope: target
    pattern: "  +"
    flags: []
    severity: warning
    description: |
      Detects accidental double-spaces in the translation target.
      Common after copy-paste from a PDF or web page.

  - id: max-target-bytes
    type: constraint
    scope: target
    constraint:
      maxBytes: 240
    severity: error
    description: |
      Translation targets must fit within the engine's per-string
      byte budget after UTF-8 encoding.

  - id: ruby-annotation-present
    type: regex
    scope: source
    pattern: "\\{ruby:[^}]+\\}"
    flags: []
    severity: info
    description: |
      Informational: source contains a ruby annotation. The Wrapper
      surfaces this in OmegaT so the translator knows to decide whether
      the target also needs a ruby annotation. Does not block.

  - id: terminator-punctuation
    type: regex
    scope: target
    pattern: "[.!?。！？]$"
    flags: []
    severity: info
    description: |
      Informational: target text does not end with sentence-ending
      punctuation. Reviewer should verify this is intentional.