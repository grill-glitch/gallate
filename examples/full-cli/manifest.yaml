# full-cli manifest
# Returned by: full-cli manifest --yaml

type: manifest
protocol:
  name: gcwp
  version: 1.0

id: full
name: Full GCWP Reference CLI
version: 1.0.0

engine:
  id: demo-engine
  versions:
    - 1.x
    - 2.x

# Engine-recognition metadata: which games / file shapes this CLI
# can recognize. Wrapper uses this as a coarse pre-filter before
# calling `cli identify <path>`.
targets:
  games:
    - name: Demo Game A
      engine_versions: ["1.5", "2.0"]
    - name: Demo Game B
      engine_versions: ["2.1"]

  formats:
    - extension: .demo
      kind: file
    - name_match: demo.ini
      kind: file
    - directory: demo/
      kind: directory

  magic_bytes:
    - offset: 0
      bytes: "44 45 4d 4f"     # "DEMO" in ASCII
      encoding: hex
      description: DEMO archive magic header